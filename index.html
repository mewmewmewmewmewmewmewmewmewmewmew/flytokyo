<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo 3D</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(to bottom, #f4f8ff 0%, #f0f2f8 42%, #e4e8f2 58%, #d8dce8 100%);
           overflow: hidden; font-family: system-ui, sans-serif; color: #1a1e30; }
    canvas { display: block; }

    #overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      pointer-events: none;
      user-select: none;
    }
    #overlay h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    #status {
      font-size: 12px;
      margin-top: 5px;
      opacity: 0.45;
    }

    #hint {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 11px;
      opacity: 0.35;
      text-align: right;
      line-height: 1.7;
      pointer-events: none;
      user-select: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, #f4f8ff 0%, #f0f2f8 42%, #e4e8f2 58%, #d8dce8 100%);
      gap: 16px;
      z-index: 10;
      transition: opacity 0.7s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }

    #load-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    #pbar-bg {
      width: 220px;
      height: 3px;
      background: #c8ccdc;
      border-radius: 2px;
      overflow: hidden;
    }
    #pbar {
      height: 100%;
      width: 0%;
      background: #4455aa;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    #load-msg { font-size: 12px; opacity: 0.45; }
    #load-version { font-size: 11px; opacity: 0.25; margin-top: 4px; }

    #version {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 11px;
      opacity: 0.28;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div id="load-title">Tokyo · Shibuya</div>
    <div id="pbar-bg"><div id="pbar"></div></div>
    <div id="load-msg">Loading…</div>
    <div id="load-version">v3.4</div>
  </div>

  <div id="overlay">
    <h1>Tokyo · Shibuya</h1>
    <div id="status"></div>
  </div>

  <div id="version">v3.4</div>

  <div id="hint">
    Click · Look &nbsp;|&nbsp; WASD · Move<br>
    Shift · Sprint &nbsp;|&nbsp; Space · Jump<br>
    Esc · Release cursor
  </div>

  <script type="importmap">
  {
    "imports": {
      "three":          "https://esm.sh/three@0.165.0",
      "three/addons/":  "https://esm.sh/three@0.165.0/examples/jsm/",
      "earcut":         "https://esm.sh/earcut@3.0.0"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
