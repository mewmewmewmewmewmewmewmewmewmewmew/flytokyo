<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><!-- v11.96 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tokyo 3D</title>
  <style>
    /* ─── Palette ────────────────────────────────────────────────────────────
       Pulled from the Sotte Bosse "ボクたちのうた" cover: a white-dominant sky,
       layered watercolor cyans, ink-black birds, and saturated CMYK accents that
       carry the sense of speed. Everything visual references these tokens. */
    :root {
      --paper:   #ffffff;   /* dominant white negative space */
      --ink:     #14171c;   /* bird silhouettes / line work   */
      --cyan-1:  #eaf6fc;   /* palest wash */
      --cyan-2:  #cfe9f7;
      --cyan-3:  #9fd6ef;
      --cyan-4:  #5bb6e0;
      --cyan-5:  #2c8fc7;   /* deepest — same blue as the bird fill */
      --acc-magenta: #ec3a8b;
      --acc-cyan:    #00a6e0;
      --acc-yellow:  #ffe23d;
      --acc-lime:    #b6d634;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; }
    /* White-dominant sky washing to a soft cyan at the horizon — most of the
       frame stays white (negative space), like the album. The watercolor clouds
       live in the #sky layer behind the transparent WebGL canvas. */
    body { background: linear-gradient(to bottom,
             var(--paper) 0%, var(--paper) 34%, var(--cyan-1) 60%,
             var(--cyan-2) 84%, var(--cyan-3) 100%);
           overflow: hidden; overscroll-behavior: none;
           font-family: system-ui, sans-serif; color: var(--ink); }
    /* position:fixed + inset:0 fills the visual viewport even when the mobile
       browser chrome (address bar) shows/hides. touch-action:none hands all
       touch events to JS so drag look works correctly on iOS/Android. */
    canvas { display: block; position: fixed; inset: 0; touch-action: none; }

    /* Watercolor cloud layer — sits BEHIND the transparent WebGL canvas (which
       clears to nothing), so clouds show through wherever no 3D geometry is
       drawn (i.e. the open sky above the city). Rendered once; not animated. */
    #sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    #sky svg { width: 100%; height: 100%; display: block; }

    /* Speed rays — a full-screen canvas of CMYK streaks fanning from the centre.
       Drawn each frame in main.js; opacity/length scale with speed, echoing the
       converging colour rays on the cover. Above the world, below the HUD. */
    #rays { z-index: 5; pointer-events: none; }

    #overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 6;           /* keep HUD text above the WebGL canvas */
      pointer-events: none;
      user-select: none;
    }
    #overlay h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    #status {
      font-size: 12px;
      margin-top: 5px;
      opacity: 0.45;
    }

    #hint {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 11px;
      opacity: 0.35;
      text-align: right;
      line-height: 1.7;
      z-index: 6;           /* sit above the WebGL canvas (appended later in the DOM) */
      pointer-events: none;
      user-select: none;
    }

    /* Toggled by hotkey 1 — hides all the HUD chrome (text + compass). */
    body.ui-hidden #overlay,
    body.ui-hidden #version,
    body.ui-hidden #speed,
    body.ui-hidden #hint,
    body.ui-hidden #compass { display: none; }

    /* Mobile: keep the HUD minimal. The compass is a 32px full-width bar flush
       to the top — keep only the location title and speed (pushed below the
       bar), and hide the stats line, the hotkey hint, and the version badge. */
    @media (max-width: 768px), (pointer: coarse) {
      /* !important so these beat the base #speed/#overlay rules, which appear
         later in the stylesheet and would otherwise win on source order. */
      #overlay { top: 42px !important; }
      #overlay h1 { font-size: 13px !important; }  /* match the speed text size */
      #overlay #status { display: none !important; }
      #speed   { top: 42px !important; }   /* align with the location title */
      #hint    { display: none !important; }
      #version { display: none !important; }
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom,
        var(--paper) 0%, var(--paper) 34%, var(--cyan-1) 60%,
        var(--cyan-2) 84%, var(--cyan-3) 100%);
      gap: 16px;
      z-index: 10;
      transition: opacity 0.7s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }

    #load-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    #pbar-bg {
      width: 220px;
      height: 3px;
      background: #c8ccdc;
      border-radius: 2px;
      overflow: hidden;
    }
    #pbar {
      height: 100%;
      width: 0%;
      background: #4455aa;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    #load-msg { font-size: 12px; opacity: 0.45; min-height: 14px; }
    #load-version {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 11px;
      opacity: 0.25;
    }

    #load-search {
      display: flex;
      gap: 8px;
      width: 320px;
      max-width: 80vw;
    }
    #place-input {
      flex: 1;
      padding: 9px 12px;
      font-size: 13px;
      font-family: inherit;
      color: #1a1e30;
      background: rgba(255,255,255,0.7);
      border: 1px solid #b8bccc;
      border-radius: 6px;
      outline: none;
    }
    #place-input:focus { border-color: #4455aa; background: #fff; }
    #place-go {
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.04em;
      color: #fff;
      background: #4455aa;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #place-go:hover { background: #3a4795; }
    #place-go:disabled { opacity: 0.5; cursor: default; }
    #place-random {
      padding: 9px 12px;
      font-size: 15px;
      line-height: 1;
      font-family: inherit;
      background: rgba(255,255,255,0.7);
      border: 1px solid #b8bccc;
      border-radius: 6px;
      cursor: pointer;
    }
    #place-random:hover { background: #fff; border-color: #4455aa; }
    #place-random:disabled { opacity: 0.5; cursor: default; }
    #place-me {
      font-size: 12px;
      font-family: inherit;
      color: #4455aa;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.8;
      padding: 2px 4px;
    }
    #place-me:hover { opacity: 1; text-decoration: underline; }
    #place-me:disabled { opacity: 0.4; cursor: default; text-decoration: none; }
    #search-msg {
      font-size: 11.5px;
      opacity: 0.5;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
      min-height: 16px;
    }

    #version {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 11px;
      opacity: 0.28;
      z-index: 6;           /* keep HUD text above the WebGL canvas */
      pointer-events: none;
      user-select: none;
    }

    #speed {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      opacity: 0.7;
      z-index: 6;           /* keep HUD text above the WebGL canvas */
      pointer-events: none;
      user-select: none;
    }

    #compass {
      position: fixed;
      top: 0;
      left: 50%;
      right: auto;          /* override the global `canvas { inset:0 }` rule … */
      bottom: auto;         /* … which would otherwise stretch the strip full-screen */
      width: 360px;
      height: 48px;
      transform: translateX(-50%);
      z-index: 6;           /* sit above the WebGL canvas */
      pointer-events: none;
      user-select: none;
    }

    /* F1 hotkey menu — a 40% white wash over the whole screen with a panel
       listing every binding. Paused state is driven from main.js. */
    #help {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      transition: opacity 0.2s ease;
      user-select: none;
    }
    #help.hidden { opacity: 0; pointer-events: none; }
    #help-panel {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #cbcfdd;
      border-radius: 14px;
      padding: 28px 38px 24px;
      box-shadow: 0 12px 44px rgba(20, 30, 60, 0.18);
      min-width: 340px;
    }
    #help-panel h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.65;
      text-align: center;
      margin-bottom: 20px;
    }
    #help-panel dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 11px 26px;
      font-size: 13px;
    }
    #help-panel dl > div { display: contents; }
    #help-panel dt {
      font-weight: 600;
      color: #4455aa;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    #help-panel dd { opacity: 0.7; }
    #help-foot {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      opacity: 0.4;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <!-- Watercolor sky: torn-edged cyan washes (feTurbulence displacement) plus a
       panel of diagonal screen-print hatching, clustered toward the top so the
       lower frame stays open for the city — mirroring the album composition. -->
  <div id="sky" aria-hidden="true">
    <svg viewBox="0 0 1000 720" preserveAspectRatio="xMidYMin slice">
      <defs>
        <filter id="wc" x="-25%" y="-25%" width="150%" height="150%">
          <feTurbulence type="fractalNoise" baseFrequency="0.011 0.015"
                        numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="46"
                             xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="1.6"/>
        </filter>
        <pattern id="hatch" width="13" height="13" patternUnits="userSpaceOnUse"
                 patternTransform="rotate(35)">
          <line x1="0" y1="0" x2="0" y2="13" stroke="#bfe0ef" stroke-width="2.4"/>
        </pattern>
      </defs>
      <!-- diagonal hatching, top-left corner -->
      <rect x="-40" y="-40" width="460" height="320" fill="url(#hatch)" opacity="0.45"/>
      <!-- layered watercolor cloud blobs -->
      <g filter="url(#wc)">
        <ellipse cx="330" cy="190" rx="200" ry="120" fill="#cdeaf7" opacity="0.9"/>
        <ellipse cx="560" cy="150" rx="165" ry="95"  fill="#a9d8ef" opacity="0.85"/>
        <ellipse cx="210" cy="300" rx="170" ry="100" fill="#bfe2f3" opacity="0.8"/>
        <ellipse cx="690" cy="250" rx="150" ry="92"  fill="#9fd6ef" opacity="0.7"/>
        <ellipse cx="450" cy="270" rx="140" ry="80"  fill="#dcf0fa" opacity="0.85"/>
        <ellipse cx="120" cy="170" rx="120" ry="78"  fill="#bfe2f3" opacity="0.7"/>
        <ellipse cx="820" cy="150" rx="140" ry="84"  fill="#cdeaf7" opacity="0.7"/>
      </g>
    </svg>
  </div>
  <canvas id="rays"></canvas>

  <div id="loading">
    <div id="load-title">Where to?</div>
    <div id="load-search">
      <input id="place-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="e.g. Shibuya Scramble Crossing">
      <button id="place-go">Go</button>
      <button id="place-random" title="Surprise me — fly to a random city">🎲</button>
    </div>
    <button id="place-me">📍 Use my location</button>
    <div id="search-msg"></div>
    <div id="pbar-bg" style="display:none"><div id="pbar"></div></div>
    <div id="load-msg"></div>
    <div id="load-version">v11.96</div>
  </div>

  <div id="overlay">
    <h1>Tokyo · Shibuya</h1>
    <div id="status"></div>
  </div>

  <div id="version">v11.96</div>
  <div id="speed"></div>
  <canvas id="compass" width="360" height="48"></canvas>

  <div id="hint">
    F1 · Controls &amp; hotkeys
  </div>

  <div id="help" class="hidden">
    <div id="help-panel">
      <h2>Controls</h2>
      <dl>
        <div><dt>Mouse</dt><dd>Look around</dd></div>
        <div><dt>Left-click</dt><dd>Fly forward</dd></div>
        <div><dt>Space</dt><dd>Brake</dd></div>
        <div><dt>Right-click</dt><dd>X-ray view</dd></div>
        <div><dt>1</dt><dd>Hide UI &amp; compass</dd></div>
        <div><dt>2</dt><dd>Building names</dd></div>
        <div><dt>3</dt><dd>POI labels</dd></div>
        <div><dt>`</dt><dd>Fisheye warp</dd></div>
        <div><dt>F</dt><dd>Fullscreen</dd></div>
        <div><dt>F1</dt><dd>Menu / Pause</dd></div>
        <div><dt>Esc</dt><dd>Release pointer / close</dd></div>
      </dl>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three":          "https://esm.sh/three@0.165.0",
      "three/addons/":  "https://esm.sh/three@0.165.0/examples/jsm/",
      "earcut":         "https://esm.sh/earcut@3.0.0"
    }
  }
  </script>
  <script type="module" src="main.js?v=11.96"></script>
</body>
</html>
