<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo 3D</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0f2f8; overflow: hidden; font-family: system-ui, sans-serif; color: #1a1e30; }
    canvas { display: block; }

    #overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      pointer-events: none;
      user-select: none;
    }
    #overlay h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    #status {
      font-size: 12px;
      margin-top: 5px;
      opacity: 0.45;
    }

    #hint {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 11px;
      opacity: 0.35;
      text-align: right;
      line-height: 1.7;
      pointer-events: none;
      user-select: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f0f2f8;
      gap: 18px;
      z-index: 10;
      transition: opacity 0.7s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }

    .spinner {
      width: 34px;
      height: 34px;
      border: 2px solid #c0c4d8;
      border-top-color: #4455aa;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #load-msg { font-size: 13px; opacity: 0.55; }

    #version {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 11px;
      opacity: 0.28;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="load-msg">Loading…</div>
  </div>

  <div id="overlay">
    <h1>Tokyo · Shibuya</h1>
    <div id="status"></div>
  </div>

  <div id="version">v2.1</div>

  <div id="hint">
    Click · Look &nbsp;|&nbsp; WASD · Move<br>
    Shift · Sprint &nbsp;|&nbsp; Space · Jump<br>
    Esc · Release cursor
  </div>

  <script type="importmap">
  {
    "imports": {
      "three":          "https://esm.sh/three@0.165.0",
      "three/addons/":  "https://esm.sh/three@0.165.0/examples/jsm/",
      "earcut":         "https://esm.sh/earcut@3.0.0"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
