<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><!-- v11.28 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tokyo 3D</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; }
    body { background: linear-gradient(to bottom, #f4f8ff 0%, #f0f2f8 42%, #e4e8f2 58%, #d8dce8 100%);
           overflow: hidden; overscroll-behavior: none;
           font-family: system-ui, sans-serif; color: #1a1e30; }
    /* position:fixed + inset:0 fills the visual viewport even when the mobile
       browser chrome (address bar) shows/hides. touch-action:none hands all
       touch events to JS so drag look works correctly on iOS/Android. */
    canvas { display: block; position: fixed; inset: 0; touch-action: none; }

    #overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      pointer-events: none;
      user-select: none;
    }
    #overlay h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    #status {
      font-size: 12px;
      margin-top: 5px;
      opacity: 0.45;
    }

    #hint {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 11px;
      opacity: 0.35;
      text-align: right;
      line-height: 1.7;
      pointer-events: none;
      user-select: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, #f4f8ff 0%, #f0f2f8 42%, #e4e8f2 58%, #d8dce8 100%);
      gap: 16px;
      z-index: 10;
      transition: opacity 0.7s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }

    #load-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    #pbar-bg {
      width: 220px;
      height: 3px;
      background: #c8ccdc;
      border-radius: 2px;
      overflow: hidden;
    }
    #pbar {
      height: 100%;
      width: 0%;
      background: #4455aa;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    #load-msg { font-size: 12px; opacity: 0.45; min-height: 14px; }
    #load-version {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 11px;
      opacity: 0.25;
    }

    #load-search {
      display: flex;
      gap: 8px;
      width: 320px;
      max-width: 80vw;
    }
    #place-input {
      flex: 1;
      padding: 9px 12px;
      font-size: 13px;
      font-family: inherit;
      color: #1a1e30;
      background: rgba(255,255,255,0.7);
      border: 1px solid #b8bccc;
      border-radius: 6px;
      outline: none;
    }
    #place-input:focus { border-color: #4455aa; background: #fff; }
    #place-go {
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.04em;
      color: #fff;
      background: #4455aa;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #place-go:hover { background: #3a4795; }
    #place-go:disabled { opacity: 0.5; cursor: default; }
    #place-me {
      font-size: 12px;
      font-family: inherit;
      color: #4455aa;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.8;
      padding: 2px 4px;
    }
    #place-me:hover { opacity: 1; text-decoration: underline; }
    #place-me:disabled { opacity: 0.4; cursor: default; text-decoration: none; }
    #search-msg {
      font-size: 11.5px;
      opacity: 0.5;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
      min-height: 16px;
    }

    #version {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 11px;
      opacity: 0.28;
      pointer-events: none;
      user-select: none;
    }

    #speed {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      opacity: 0.7;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div id="load-title">Where to?</div>
    <div id="load-search">
      <input id="place-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="e.g. Shibuya Scramble Crossing">
      <button id="place-go">Go</button>
    </div>
    <button id="place-me">📍 Use my location</button>
    <div id="search-msg"></div>
    <div id="pbar-bg" style="display:none"><div id="pbar"></div></div>
    <div id="load-msg"></div>
    <div id="load-version">v11.28</div>
  </div>

  <div id="overlay">
    <h1>Tokyo · Shibuya</h1>
    <div id="status"></div>
  </div>

  <div id="version">v11.28</div>
  <div id="speed"></div>

  <div id="hint">
    Mouse · Look &nbsp;|&nbsp; W / Left-click · Fly forward &nbsp;|&nbsp; S · Brake &nbsp;|&nbsp; Space · Ascend<br>
    A/D · Turn &nbsp;|&nbsp; Shift · Sprint &nbsp;|&nbsp; Right-click · X-ray<br>
    F1 · Names &nbsp;|&nbsp; F2 · POIs &nbsp;|&nbsp; F3 · Fisheye &nbsp;|&nbsp; Esc · Release
  </div>

  <script type="importmap">
  {
    "imports": {
      "three":          "https://esm.sh/three@0.165.0",
      "three/addons/":  "https://esm.sh/three@0.165.0/examples/jsm/",
      "earcut":         "https://esm.sh/earcut@3.0.0"
    }
  }
  </script>
  <script type="module" src="main.js?v=11.28"></script>
</body>
</html>
